    <!-- ===== 随机动态图片切换脚本 ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var currentPath = window.location.pathname.replace(/\/$/, '') || '/';
            document.querySelectorAll('.nav-link').forEach(function(link) {
                var linkPath = new URL(link.href, window.location.origin).pathname.replace(/\/$/, '') || '/';
                if (linkPath === currentPath || (linkPath === '/categories.html' && currentPath.indexOf('/category/') === 0) || (linkPath === '/tags.html' && currentPath.indexOf('/tag/') === 0) || (linkPath.indexOf('/author/') === 0 && currentPath.indexOf('/author/') === 0)) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });

            var video = document.getElementById('bg-video');
            if (!video) return;

            var imageList = [
                '/images/blog.webp',
                '/images/blog1.webp',
                '/images/blog2.webp'
            ];

            var availableImages = [];
            var checkCount = 0;
            if (imageList.length === 0) {
                imageList.push('/images/blog.webp');
            }
            imageList.forEach(function(src) {
                var testImage = new Image();
                testImage.src = src;
                testImage.onload = function() {
                    availableImages.push(src);
                    checkCount++;
                    if (checkCount === imageList.length) {
                        applyRandomImage();
                    }
                };
                testImage.onerror = function() {
                    checkCount++;
                    if (checkCount === imageList.length) {
                        applyRandomImage();
                    }
                };
            });

            function applyRandomImage() {
                if (availableImages.length === 0) {
                    availableImages = imageList.slice(0, 1);
                }
                var randomIndex = Math.floor(Math.random() * availableImages.length);
                document.getElementById('bg-video').src = availableImages[randomIndex];
            }
        });
    </script>
