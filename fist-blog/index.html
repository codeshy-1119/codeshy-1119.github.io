<!-- ===== JavaScript：生成目录 + 交互 ===== -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // ----- 1. 从文章正文提取标题生成目录 -----
    var articleBody = document.querySelector('.article-body');
    if (!articleBody) return;

    var headings = articleBody.querySelectorAll('h1, h2, h3, h4, h5, h6');
    if (headings.length === 0) {
        document.getElementById('toc-toggle').style.display = 'none';
        return;
    }

    var tocList = document.createElement('ul');
    var stack = [tocList];
    var parentLevel = 1; // 从 h1 开始

    headings.forEach(function(heading) {
        var level = parseInt(heading.tagName.charAt(1));

        // 生成锚点 id（如果没有）
        if (!heading.id) {
            heading.id = 'toc-' + heading.textContent.trim()
                .replace(/\s+/g, '-')
                .replace(/[^a-zA-Z0-9\u4e00-\u9fa5\-]/g, '');
        }

        // 调整层级栈
        while (level > parentLevel) {
            var newList = document.createElement('ul');
            var lastLi = stack[stack.length-1].lastElementChild;
            if (lastLi && lastLi.tagName === 'LI') {
                lastLi.appendChild(newList);
                stack.push(newList);
                parentLevel++;
            } else {
                var li = document.createElement('li');
                li.style.listStyle = 'none';
                stack[stack.length-1].appendChild(li);
                var subUl = document.createElement('ul');
                li.appendChild(subUl);
                stack.push(subUl);
                parentLevel++;
            }
        }
        while (level < parentLevel) {
            stack.pop();
            parentLevel--;
        }

        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + heading.id;
        a.textContent = heading.textContent.trim();
        a.addEventListener('click', function(e) {
            e.preventDefault();
            var target = document.getElementById(this.getAttribute('href').substring(1));
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
        li.appendChild(a);
        stack[stack.length-1].appendChild(li);
    });

    var tocContainer = document.getElementById('toc-content');
    tocContainer.appendChild(tocList);

    // ----- 2. 为有子目录的条目添加展开/收起按钮 -----
    tocContainer.querySelectorAll('li').forEach(function(li) {
        var childList = li.querySelector(':scope > ul');
        if (!childList) return;

        li.classList.add('has-children');
        var link = li.querySelector(':scope > a');
        var disclosure = document.createElement('button');
        disclosure.type = 'button';
        disclosure.className = 'toc-disclosure';
        disclosure.textContent = '▸';
        disclosure.setAttribute('aria-expanded', 'false');
        disclosure.setAttribute('aria-label', '展开子目录');
        disclosure.addEventListener('click', function() {
            var expanded = li.classList.toggle('expanded');
            disclosure.textContent = expanded ? '▾' : '▸';
            disclosure.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            disclosure.setAttribute('aria-label', expanded ? '收起子目录' : '展开子目录');
        });
        li.insertBefore(disclosure, link);
    });

    // ----- 3. 面板展开/收起 -----
    var panel = document.getElementById('toc-panel');
    var toggleBtn = document.getElementById('toc-toggle');
    var closeBtn = document.getElementById('toc-close');

    function openToc() {
        panel.classList.add('open');
    }
    function closeToc() {
        panel.classList.remove('open');
    }

    toggleBtn.addEventListener('click', function() {
        if (panel.classList.contains('open')) {
            closeToc();
        } else {
            openToc();
        }
    });
    closeBtn.addEventListener('click', closeToc);

    document.addEventListener('click', function(e) {
        if (panel.classList.contains('open')) {
            var target = e.target;
            if (!panel.contains(target) && target !== toggleBtn && !toggleBtn.contains(target)) {
                closeToc();
            }
        }
    });

    // ----- 4. 滚动时高亮当前标题 -----
    var tocLinks = tocContainer.querySelectorAll('a');
    function setActiveLink() {
        var activeId = null;
        headings.forEach(function(h) {
            var rect = h.getBoundingClientRect();
            if (rect.top <= 120) {
                activeId = h.id;
            }
        });
        tocLinks.forEach(function(link) {
            link.classList.remove('active');
            if (activeId && link.getAttribute('href') === '#' + activeId) {
                link.classList.add('active');
                var parent = link.parentElement;
                while (parent && parent !== tocContainer) {
                    if (parent.tagName === 'LI' && parent.classList.contains('has-children')) {
                        parent.classList.add('expanded');
                        var button = parent.querySelector(':scope > .toc-disclosure');
                        if (button) {
                            button.textContent = '▾';
                            button.setAttribute('aria-expanded', 'true');
                            button.setAttribute('aria-label', '收起子目录');
                        }
                    }
                    parent = parent.parentElement;
                }
            }
        });
    }
    window.addEventListener('scroll', setActiveLink);
    setActiveLink();
});
</script>

    <!-- ===== 随机视频切换脚本 ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var currentPath = window.location.pathname.replace(/\/$/, '') || '/';
            document.querySelectorAll('.nav-link').forEach(function(link) {
                var linkPath = new URL(link.href, window.location.origin).pathname.replace(/\/$/, '') || '/';
                if (linkPath === currentPath || (linkPath === '/categories.html' && currentPath.indexOf('/category/') === 0) || (linkPath === '/tags.html' && currentPath.indexOf('/tag/') === 0) || (linkPath.indexOf('/author/') === 0 && currentPath.indexOf('/author/') === 0)) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });

            var video = document.getElementById('bg-video');
            if (!video) return;

            video.autoplay = true;
            video.muted = true;
            video.loop = true;
            video.playsInline = true;

            // 某些浏览器在动态替换视频源后不会可靠执行 loop，结束时手动重播。
            video.addEventListener('ended', function() {
                video.currentTime = 0;
                video.play().catch(function() {
                    console.log('视频循环播放被浏览器拦截');
                });
            });

            var videoList = [
                '/images/blog.mp4',
                '/images/blog1.mp4',
                '/images/blog2.mp4'
            ];

            var availableVideos = [];
            var checkCount = 0;
            if (videoList.length === 0) {
                videoList.push('/images/blog.mp4');
            }
            videoList.forEach(function(src) {
                var testVideo = document.createElement('video');
                testVideo.src = src;
                testVideo.onloadeddata = function() {
                    availableVideos.push(src);
                    checkCount++;
                    if (checkCount === videoList.length) {
                        applyRandomVideo();
                    }
                };
                testVideo.onerror = function() {
                    checkCount++;
                    if (checkCount === videoList.length) {
                        applyRandomVideo();
                    }
                };
            });

            function applyRandomVideo() {
                if (availableVideos.length === 0) {
                    availableVideos = videoList.slice(0, 1);
                }
                var randomIndex = Math.floor(Math.random() * availableVideos.length);
                var selected = availableVideos[randomIndex];
                video.src = selected;
                video.loop = true;
                video.load();
                video.play().catch(function(e) {
                    console.log('视频自动播放被拦截');
                });
            }
        });
    </script>
