<!DOCTYPE html>
<html lang="chinese (simplified)">
<head>
    <title> &ndash; Categories</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://codeshy-1119.github.io/theme/css/style.min.css" />
    <link rel="stylesheet" href="https://codeshy-1119.github.io/theme/css/dark-theme.min.css" />
    <link rel="stylesheet" href="https://codeshy-1119.github.io/custom.css" />
</head>

<body>

    <!-- ===== 全局随机动态图片背景 ===== -->
    <div id="global-hero">
        <img src="https://codeshy-1119.github.io/images/blog.webp" alt="" decoding="async" id="bg-video">
    </div>

    <!-- ===== 顶部导航栏（固定） ===== -->
    <nav id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="https://codeshy-1119.github.io/" class="nav-brand">才华恒毅的blog</a>
            </div>
            <div class="nav-right">
                <a href="https://codeshy-1119.github.io/" class="nav-link">首页</a>
                <a href="https://codeshy-1119.github.io/archives.html" class="nav-link">归档</a>
                <a href="https://codeshy-1119.github.io/categories.html" class="nav-link">分类</a>
                <a href="https://codeshy-1119.github.io/tags.html" class="nav-link">标签</a>
                <a href="https://codeshy-1119.github.io/author/cai-hua-heng-yi.html" class="nav-link">关于</a>
            </div>
        </div>
    </nav>

    <!-- ===== 页面内容（子模板填充） ===== -->
<main class="directory-page">
  <header class="directory-header">
    <span class="eyebrow">CONTENT INDEX</span>
    <h1 id="categories">文章分类</h1>
    <p>按主题浏览，快速找到同一方向的学习记录。</p>
    <div class="directory-count">2 个分类</div>
  </header>
  <div class="directory-grid">
    <a class="directory-card" href="https://codeshy-1119.github.io/category/essay.html">
      <span class="directory-index">01</span>
      <span class="directory-card-body">
        <strong>Essay</strong>
        <small>1 篇文章</small>
      </span>
      <span class="directory-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="directory-card" href="https://codeshy-1119.github.io/category/ji-zhu.html">
      <span class="directory-index">02</span>
      <span class="directory-card-body">
        <strong>技术</strong>
        <small>4 篇文章</small>
      </span>
      <span class="directory-arrow" aria-hidden="true">↗</span>
    </a>
  </div>
</main>

<style>
  .directory-page { max-width: 980px; margin: 8vh auto 80px; padding: 0 24px; position: relative; z-index: 1; }
  .directory-header { color: #fff; text-align: left; margin-bottom: 32px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .eyebrow { color: #b9ead8; font-size: .75rem; letter-spacing: .16em; font-weight: 700; }
  .directory-header h1 { margin: 8px 0 6px; font-size: clamp(2rem, 5vw, 3.2rem); }
  .directory-header p { margin: 0; opacity: .82; font-size: 1.05rem; }
  .directory-count { margin-top: 18px; color: #d4f1e6; font-size: .9rem; }
  .directory-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .directory-card { display: flex; align-items: center; gap: 16px; min-height: 102px; padding: 20px; color: #19372c; text-decoration: none; background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.35); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.14); transition: transform .2s, background .2s; }
  .directory-card:hover { transform: translateY(-3px); background: #fff; }
  .directory-index { color: #2a9d8f; font: 700 1.1rem Georgia, serif; }
  .directory-card-body { display: flex; flex: 1; flex-direction: column; gap: 7px; }
  .directory-card-body strong { font-size: 1.12rem; }
  .directory-card-body small { color: #718078; }
  .directory-arrow { color: #2a9d8f; font-size: 1.35rem; }
  @media (max-width: 640px) { .directory-page { margin-top: 5vh; padding: 0 16px; } .directory-grid { grid-template-columns: 1fr; } }
</style>

    <!-- ===== 底部版权信息 ===== -->
    <footer style="text-align:center;padding:20px;background:transparent;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.5);position:relative;z-index:1;">
        <p>&copy; 才华恒毅的blog 2026</p>
    </footer>

    <style>
        /* ===== 全局视频背景层 ===== */
        #global-hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        #global-hero img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
        }

        /* ===== 导航栏（固定在顶部） ===== */
        #navbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            z-index: 1000 !important;
            padding: 12px 20px !important;
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15) !important;
            box-sizing: border-box !important;
            transition: background 0.3s !important;
        }
        #navbar:hover {
            background: rgba(255, 255, 255, 0.25) !important;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }
        .nav-brand {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            letter-spacing: 0.5px;
        }
        .nav-brand:hover {
            color: #d4edda;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 6px 14px;
            flex-wrap: wrap;
        }
        .nav-link {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 30px;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            text-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: scale(1.04);
        }
        .nav-link.active {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        @media (max-width: 640px) {
            #navbar {
                padding: 10px 14px !important;
            }
            .nav-brand {
                font-size: 1.05rem;
            }
            .nav-link {
                font-size: 0.8rem;
                padding: 4px 10px;
            }
            .nav-right {
                gap: 4px 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
            #bg-video {
                display: none;
            }
            #global-hero {
                background: linear-gradient(135deg, #17372e, #2a806f);
            }
        }

        /* ===== 给页面内容留出顶部空间 ===== */
        body {
            padding-top: 70px !important;
            margin: 0 !important;
            background: transparent !important;
        }

        /* ===== 确保所有内容层级在视频之上 ===== */
        #navbar,
        #header-fixed,
        #content-drawer,
        #archives-header,
        #timeline,
        #article-content,
        #author-section,
        #article-list,
        #back-home,
        #toggle-drawer,
        footer {
            position: relative;
            z-index: 1;
        }

        /* ===== 修复右下角所有按钮的固定位置 ===== */
        #back-home,
        #toggle-drawer {
            position: fixed !important;
            bottom: 25px !important;
            right: 25px !important;
            z-index: 100 !important;
        }

        /* ===== 页面滚动时保持背景稳定 ===== */
        html, body {
            overflow-y: auto;
        }
    </style>

    <!-- ===== 随机动态图片切换脚本 ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var currentPath = window.location.pathname.replace(/\/$/, '') || '/';
            document.querySelectorAll('.nav-link').forEach(function(link) {
                var linkPath = new URL(link.href, window.location.origin).pathname.replace(/\/$/, '') || '/';
                if (linkPath === currentPath || (linkPath === '/categories.html' && currentPath.indexOf('/category/') === 0) || (linkPath === '/tags.html' && currentPath.indexOf('/tag/') === 0) || (linkPath.indexOf('/author/') === 0 && currentPath.indexOf('/author/') === 0)) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });

            var video = document.getElementById('bg-video');
            if (!video) return;

            var imageList = [
                '/images/blog.webp',
                '/images/blog1.webp',
                '/images/blog2.webp'
            ];

            var availableImages = [];
            var checkCount = 0;
            if (imageList.length === 0) {
                imageList.push('/images/blog.webp');
            }
            imageList.forEach(function(src) {
                var testImage = new Image();
                testImage.src = src;
                testImage.onload = function() {
                    availableImages.push(src);
                    checkCount++;
                    if (checkCount === imageList.length) {
                        applyRandomImage();
                    }
                };
                testImage.onerror = function() {
                    checkCount++;
                    if (checkCount === imageList.length) {
                        applyRandomImage();
                    }
                };
            });

            function applyRandomImage() {
                if (availableImages.length === 0) {
                    availableImages = imageList.slice(0, 1);
                }
                var randomIndex = Math.floor(Math.random() * availableImages.length);
                document.getElementById('bg-video').src = availableImages[randomIndex];
            }
        });
    </script>

</body>
</html>
